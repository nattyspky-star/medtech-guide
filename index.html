<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedTech Quick Reference — คู่มืออ้างอิงงานเทคนิคการแพทย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --ink:#122E29;
    --ink-soft:#3F5651;
    --muted:#6B7C78;
    --line:#DCE6E2;
    --teal:#2F6F63;
    --teal-deep:#1B463C;
    --teal-tint:#E7F0EC;
    --amber:#B8863A;
    --amber-tint:#FBF1DF;
    --crit:#A73B2E;
    --crit-tint:#FBEAE7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:'IBM Plex Serif',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--teal-deep);color:#EFF6F3;
    padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:3px solid var(--amber);
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand .title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:19px;letter-spacing:.2px;}
  .brand .sub{font-size:12px;color:#B9D3CB;}
  .search-wrap{flex:1 1 280px;max-width:420px;position:relative;}
  .search-wrap input{
    width:100%;padding:10px 14px 10px 36px;border-radius:8px;border:1px solid transparent;
    background:#0F332B;color:#EFF6F3;font-size:14px;outline:none;
  }
  .search-wrap input::placeholder{color:#9DBAB1;}
  .search-wrap input:focus{border-color:var(--amber);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7;}

  /* ---- Layout ---- */
  .layout{display:flex;flex:1;min-height:0;}
  nav.sections{
    width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);
    padding:14px 10px;overflow-y:auto;
  }
  nav.sections .sec-btn{
    display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;color:var(--ink-soft);
    border-left:3px solid transparent;
  }
  nav.sections .sec-btn .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  nav.sections .sec-btn:hover{background:var(--teal-tint);}
  nav.sections .sec-btn.active{background:var(--teal-tint);color:var(--teal-deep);font-weight:600;border-left-color:var(--teal);}

  main{flex:1;min-width:0;padding:22px 26px 60px;overflow-y:auto;}
  .section-head{margin-bottom:6px;}
  .section-head h2{font-size:23px;color:var(--teal-deep);}
  .section-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;}

  .category{margin-top:26px;}
  .category h3{font-size:15px;color:var(--ink-soft);text-transform:none;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}

  .test-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .test-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
  .test-head:hover{background:#FAFCFB;}
  .test-head .name{font-weight:600;font-size:15px;color:var(--ink);}
  .test-head .specimen{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .chev{color:var(--muted);transition:transform .15s ease;flex:0 0 auto;}
  .test-card.open .chev{transform:rotate(180deg);}

  .test-body{padding:0 16px 16px;display:none;}
  .test-card.open .test-body{display:block;}

  table.params{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:13.5px;}
  table.params th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.3px;padding:6px 10px;border-bottom:1px solid var(--line);}
  table.params td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.params td.rng{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  table.params tr:last-child td{border-bottom:none;}
  .crit-tag{display:inline-block;margin-top:2px;font-size:11.5px;background:var(--crit-tint);color:var(--crit);padding:1px 7px;border-radius:5px;font-family:'IBM Plex Mono',monospace;}

  .block{margin-top:12px;}
  .block h4{font-size:12px;letter-spacing:.3px;color:var(--teal-deep);margin:0 0 6px;font-weight:600;}
  .block ul{margin:0;padding-left:19px;}
  .block li{margin-bottom:4px;font-size:13.8px;}
  .block p{margin:0;font-size:13.8px;}
  .qc-block h4{color:var(--amber);}

  .art-panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px 14px;margin:14px 0 22px;
  }
  .art-panel h3{font-size:14px;color:var(--teal-deep);margin:0 0 3px;border:none;padding:0;}
  .art-panel .art-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .art-panel svg{width:100%;height:auto;display:block;}
  .art-panel .art-legend{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;}
  .art-panel .art-legend .crit{color:var(--crit);font-weight:600;}
  .art-panel .art-links{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .art-panel .art-links a{display:inline-block;font-size:12px;color:var(--teal);text-decoration:none;}
  .art-panel .art-links a:hover{text-decoration:underline;}

  .note-area{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .note-area h4{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;}
  .note-area textarea{
    width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;font-family:inherit;font-size:13.5px;background:#FCFDFC;color:var(--ink);
  }
  .note-status{font-size:11px;color:var(--muted);margin-top:4px;height:14px;}

  .search-results-head{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .badge-path{display:inline-block;font-size:11px;background:var(--teal-tint);color:var(--teal-deep);padding:2px 8px;border-radius:6px;margin-bottom:6px;}

  .disclaimer{
    margin:26px 0 0;padding:12px 14px;background:var(--amber-tint);border:1px solid #E8D6AE;
    border-radius:8px;font-size:12.5px;color:#6B5322;
  }

  /* mobile */
  @media (max-width:760px){
    .layout{flex-direction:column;}
    nav.sections{
      width:100%;flex:0 0 auto;display:flex;overflow-x:auto;gap:4px;padding:10px 10px;
      border-right:none;border-bottom:1px solid var(--line);white-space:nowrap;
    }
    nav.sections .sec-btn{border-left:none;border-bottom:3px solid transparent;flex:0 0 auto;}
    nav.sections .sec-btn.active{border-left:none;border-bottom-color:var(--teal);}
    main{padding:16px 14px 50px;}
    .brand .sub{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   DATA — เพิ่ม/แก้ไขรายการตรวจได้ที่นี่
   โครงสร้าง: sections -> categories -> tests
   test = { id, name, specimen, params:[{name, range, critical}], method, procedure:[...], qc:[...] }
   ===================================================================== */
const SECTIONS = [
{
  id:'heme', name:'โลหิตวิทยา', sub:'Hematology',
  categories:[
    { name:'Complete Blood Count & Indices', tests:[
      { id:'cbc', name:'CBC (Complete Blood Count)', specimen:'EDTA (จุกม่วง) whole blood',
        params:[
          {name:'WBC', range:'4.5–11.0 ×10³/µL', critical:'<2.0 หรือ >30.0'},
          {name:'RBC', range:'ชาย 4.5–5.9 / หญิง 4.0–5.2 ×10⁶/µL'},
          {name:'Hemoglobin (Hb)', range:'ชาย 13.5–17.5 / หญิง 12.0–15.5 g/dL', critical:'<7.0 หรือ >20.0'},
          {name:'Hematocrit (Hct)', range:'ชาย 41–53% / หญิง 36–46%', critical:'<15% หรือ >60%'},
          {name:'MCV', range:'80–100 fL'},
          {name:'MCH', range:'27–33 pg'},
          {name:'MCHC', range:'32–36 g/dL'},
          {name:'RDW', range:'11.5–14.5%'},
          {name:'Platelet', range:'150–450 ×10³/µL', critical:'<20 หรือ >1,000'}
        ],
        method:'Automated hematology analyzer (impedance/optical + flow cytometry) ยืนยันผลผิดปกติด้วยการดู peripheral blood smear',
        procedure:[
          'ผสมหลอด EDTA เบา ๆ 8–10 ครั้งทันทีหลังเจาะ',
          'ควรวิเคราะห์ภายใน 4 ชม. (ตัวนับเกล็ดเลือดควรวิเคราะห์เร็วที่สุด <30 นาทีถ้าเป็นไปได้)',
          'โหลดหลอดเข้าเครื่อง ตรวจสอบ flag ที่เครื่องแจ้งเตือน',
          'ทำ smear ทบทวนด้วยตาหากมี flag ผิดปกติหรือค่าไม่สอดคล้องกับอาการทางคลินิก'
        ],
        qc:[
          'รัน control 2–3 ระดับทุกกะ ตรวจสอบว่าอยู่ในช่วงที่กำหนด',
          'ติดตามแนวโน้มด้วย Levey-Jennings chart',
          'ทำ delta check เทียบผลเดิมของผู้ป่วย',
          'สหสัมพันธ์ผลนับกับสัณฐานวิทยาบน smear เสมอเมื่อมี flag'
        ]
      }
    ]},
    { name:'Differential & Morphology', tests:[
      { id:'diff', name:'WBC Differential (Manual/Automated)', specimen:'EDTA whole blood / blood smear',
        params:[
          {name:'Neutrophil (Segmented)', range:'40–70%'},
          {name:'Band form', range:'0–5%'},
          {name:'Lymphocyte', range:'20–45%'},
          {name:'Monocyte', range:'2–10%'},
          {name:'Eosinophil', range:'1–6%'},
          {name:'Basophil', range:'0–2%'}
        ],
        method:'Wright-Giemsa stained smear ดูด้วยกล้องจุลทรรศน์กำลังขยาย 100x oil immersion หรือ automated flow-based differential พร้อมยืนยันด้วยมือเมื่อมี flag',
        procedure:[
          'ทำ smear บาง ๆ ปลายเรียว (feather edge) ผึ่งให้แห้ง',
          'ย้อมด้วย Wright-Giemsa ตามเวลาที่กำหนด',
          'ตรวจในบริเวณ monolayer นับเม็ดเลือดขาว 100 เซลล์แบบ battlement pattern',
          'บันทึกสัณฐานของ RBC และ platelet ร่วมด้วย'
        ],
        qc:[
          'เปรียบเทียบผล manual กับ automated differential เมื่อมี flag',
          'ตรวจคุณภาพสียืนย้อมด้วย control slide',
          'ให้หัวหน้างาน/ผู้ชำนาญทบทวนเซลล์ผิดปกติ (atypical cells)'
        ]
      },
      { id:'retic', name:'Reticulocyte Count', specimen:'EDTA whole blood',
        params:[{name:'Reticulocyte %', range:'ผู้ใหญ่ 0.5–2.5%'},{name:'Absolute retic', range:'25–75 ×10³/µL'}],
        method:'Supravital stain (New Methylene Blue) หรือ automated flow cytometry',
        procedure:['ผสมเลือดกับสีย้อมอัตราส่วน 1:1','บ่ม 10–15 นาที','ทำ smear และนับ reticulocyte ต่อ RBC 1,000 เซลล์'],
        qc:['รัน control ตามคู่มือผู้ผลิต','สหสัมพันธ์กับการวินิจฉัยภาวะโลหิตจาง (retic ควรสูงขึ้นเมื่อมีการชดเชยจากไขกระดูก)']
      }
    ]},
    { name:'ESR', tests:[
      { id:'esr', name:'Erythrocyte Sedimentation Rate (ESR)', specimen:'Sodium citrate หรือ EDTA (ตามวิธี)',
        params:[
          {name:'ชาย <50 ปี', range:'0–15 mm/hr'},
          {name:'ชาย >50 ปี', range:'0–20 mm/hr'},
          {name:'หญิง <50 ปี', range:'0–20 mm/hr'},
          {name:'หญิง >50 ปี', range:'0–30 mm/hr'}
        ],
        method:'Westergren method (มาตรฐาน) หรือ modified/automated method',
        procedure:['เติมเลือดลงหลอด Westergren ถึงขีด 200 มม.','ตั้งหลอดในแนวดิ่งสนิท ห่างจากแรงสั่นสะเทือนและแสงแดดจัด','อ่านผลที่เวลา 60 นาทีพอดี'],
        qc:['หลอดต้องตั้งตรงแนวดิ่งจริง ๆ','อ่านผลตรงเวลาที่กำหนดเท่านั้น','อุณหภูมิห้องควรอยู่ 18–25°C']
      }
    ]},
    { name:'RBC & Platelet Morphology และการรายงานผล', tests:[
      { id:'rbcmorph', name:'RBC Morphology & Reporting', specimen:'Peripheral blood smear (Wright-Giemsa stain)',
        params:[
          {name:'Anisocytosis (ขนาดไม่เท่ากัน)', range:'รายงานเป็น 1+ ถึง 4+ (สัมพันธ์กับ RDW)'},
          {name:'Poikilocytosis (รูปร่างผิดปกติ)', range:'รายงานเป็น 1+ ถึง 4+ พร้อมระบุชนิด'},
          {name:'Hypochromia', range:'พื้นที่ central pallor >1/3 ของเซลล์ = hypochromic'},
          {name:'Polychromasia', range:'RBC ติดสีน้ำเงินอมม่วง บ่งชี้ reticulocyte เพิ่ม'}
        ],
        method:'ตรวจในบริเวณ monolayer (เซลล์ไม่ทับซ้อน ไม่บางเกินไป) กำลังขยาย 100x oil immersion อย่างน้อย 10 ฟิลด์',
        procedure:[
          'เลือกบริเวณ monolayer ของ smear ที่ RBC เรียงตัวพอดี ไม่ซ้อนทับกัน',
          'ประเมิน size (anisocytosis): เทียบกับ small lymphocyte nucleus เป็นเกณฑ์',
          'ประเมิน shape (poikilocytosis): มองหารูปร่างผิดปกติเฉพาะ เช่น spherocyte (กลมไม่มี central pallor), target cell (มีจุดกลางเข้ม), sickle cell (รูปเคียว), schistocyte (เศษเซลล์แตก), teardrop cell (หยดน้ำตา), burr cell/echinocyte (หนามเล็กสม่ำเสมอ), acanthocyte (หนามใหญ่ไม่สม่ำเสมอ)',
          'ประเมินสี (chromia): ดูขนาด central pallor เทียบกับเส้นผ่านศูนย์กลางเซลล์',
          'นับสัดส่วนเซลล์ผิดปกติแล้วให้เกรดตามตารางมาตรฐานของห้องปฏิบัติการ (เช่น 1+ = 5–10%, 2+ = 10–25%, 3+ = 25–50%, 4+ = >50%)',
          'บันทึกร่วมกับ RBC inclusion หากพบ เช่น Howell-Jolly body, basophilic stippling, malaria parasite',
          'รายงานผลรวมในใบรายงาน CBC เป็นคำอธิบายสัณฐานวิทยา ควบคู่กับตัวเลข indices (MCV, MCH, MCHC, RDW)'
        ],
        qc:['ต้องรายงานสัณฐานวิทยาให้สอดคล้องกับ indices เช่น MCV ต่ำ + hypochromia เข้าได้กับ iron deficiency หรือ thalassemia','ให้ผู้ตรวจสอบระดับสูงทบทวนเมื่อพบเซลล์ผิดปกติชนิดที่มีนัยสำคัญ (เช่น schistocyte จำนวนมาก สงสัย MAHA/TTP ต้องรายงาน critical value)']
      },
      { id:'pltmorph', name:'Platelet Estimate & Reporting', specimen:'Peripheral blood smear (Wright-Giemsa stain)',
        params:[
          {name:'ค่าประมาณจากการนับด้วยตา (Estimate)', range:'เฉลี่ยจำนวนเกล็ดเลือดต่อ oil-immersion field (100x) × 15,000–20,000 = ค่าประมาณต่อ µL'},
          {name:'Adequate', range:'สอดคล้องกับค่าที่เครื่องนับอัตโนมัติรายงาน'},
          {name:'Decreased', range:'<150 ×10³/µL — ให้ยืนยันว่าไม่ใช่ platelet clumping'},
          {name:'Increased', range:'>450 ×10³/µL'}
        ],
        method:'นับจำนวนเกล็ดเลือดเฉลี่ยจาก 10 ฟิลด์ในบริเวณ monolayer ที่กำลังขยาย 100x oil immersion',
        procedure:[
          'เลือกบริเวณ monolayer ที่ RBC ไม่ซ้อนทับและกระจายสม่ำเสมอ',
          'นับจำนวนเกล็ดเลือดใน 10 ฟิลด์ (100x oil) แล้วหาค่าเฉลี่ยต่อฟิลด์',
          'คูณค่าเฉลี่ยด้วยตัวคูณของกล้อง/ห้องปฏิบัติการ (โดยทั่วไป 15,000–20,000) เพื่อประมาณค่าต่อ µL',
          'เปรียบเทียบค่าประมาณกับผลจากเครื่องนับอัตโนมัติ หากต่างกันมากให้ตรวจสอบสาเหตุ',
          'ตรวจสอบ platelet morphology: ขนาด (giant platelet เข้าได้กับ ITP หรือ myeloproliferative), granularity, การจับกลุ่ม (clumping)',
          'หากพบ platelet clumping จำนวนมากบน smear แต่เครื่องรายงานเกล็ดเลือดต่ำ ให้สงสัย pseudothrombocytopenia จาก EDTA และแนะนำเก็บซ้ำด้วย sodium citrate tube',
          'รายงานผลเป็นทั้งค่าประมาณและคำอธิบาย (เช่น "Platelet adequate, few giant forms noted")'
        ],
        qc:['เกล็ดเลือดต่ำมากที่ยืนยันแล้วว่าไม่ใช่ clumping (<20 ×10³/µL) ต้องรายงานเป็น critical value ทันที','ตรวจสอบ EDTA-induced platelet clumping/satellitism เสมอเมื่อผลเกล็ดเลือดจากเครื่องต่ำผิดปกติโดยไม่มีอาการทางคลินิก']
      }
    ]},
    { name:'เทคนิคการย้อมสีและการคำนวณแก้ไขผล', tests:[
      { id:'giemsa', name:'การย้อมสี Wright-Giemsa (Peripheral Blood Smear Staining)', specimen:'Blood smear ที่ทำแห้งสนิทแล้ว (air-dried)',
        params:[
          {name:'Wright stain (undiluted)', range:'ย้อมนาน 1–3 นาที (ตามคู่มือน้ำยาแต่ละ lot)'},
          {name:'Buffer (phosphate buffered water)', range:'pH 6.4–6.8 เติมปริมาณเท่ากับ stain แล้วผสม 3–5 นาที'},
          {name:'ล้างด้วยน้ำไหลผ่านเบา ๆ', range:'จนน้ำที่ไหลออกใส ไม่มีคราบสีตกค้าง'}
        ],
        method:'Romanowsky-type stain — Wright stain (methanol-fixed eosin-methylene blue) ผสมกับ buffer เพื่อให้เกิดสีที่จำเพาะต่อโครงสร้างเซลล์',

/* ===================== STATE & STORAGE ===================== */
let state = { sectionId: SECTIONS[0].id, query:'', openTest:null };
const noteCache = {};

async function loadNote(testId){
  if(noteCache[testId] !== undefined) return noteCache[testId];
  try{
    const res = await window.storage.get('note:'+testId, false);
    noteCache[testId] = res ? res.value : '';
  }catch(e){ noteCache[testId] = ''; }
  return noteCache[testId];
}
async function saveNote(testId, value, statusEl){
  try{
    await window.storage.set('note:'+testId, value, false);
    noteCache[testId] = value;
    if(statusEl) statusEl.textContent = 'บันทึกแล้ว';
  }catch(e){
    if(statusEl) statusEl.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
  }
}

/* ===================== HELPERS ===================== */
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function findAllTests(){
  const out = [];
  SECTIONS.forEach(sec => sec.categories.forEach(cat => cat.tests.forEach(t => out.push({sec, cat, test:t}))));
  return out;
}

/* ===================== RENDER ===================== */
function renderNav(){
  return `<nav class="sections">${SECTIONS.map((s,i)=>`
    <button class="sec-btn ${s.id===state.sectionId && !state.query ? 'active':''}" onclick="selectSection('${s.id}')">
      <span class="n">${String(i+1).padStart(2,'0')}</span> ${esc(s.name)}
    </button>`).join('')}</nav>`;
}

function renderTestCard(test, pathLabel){
  const isOpen = state.openTest === test.id;
  const paramsHtml = (test.params||[]).map(p => `
    <tr><td>${esc(p.name)}</td><td class="rng">${esc(p.range)}${p.critical? `<br><span class="crit-tag">Critical: ${esc(p.critical)}</span>`:''}</td></tr>
  `).join('');
  return `
  <div class="test-card ${isOpen?'open':''}" id="card-${test.id}">
    <div class="test-head" onclick="toggleTest('${test.id}')">
      <div>
        ${pathLabel? `<div class="badge-path">${esc(pathLabel)}</div>`:''}
        <div class="name">${esc(test.name)}</div>
        ${test.specimen? `<div class="specimen">สิ่งส่งตรวจ: ${esc(test.specimen)}</div>`:''}
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="test-body">
      ${test.params? `<table class="params"><thead><tr><th>รายการ</th><th>ค่าอ้างอิง</th></tr></thead><tbody>${paramsHtml}</tbody></table>`:''}
      ${test.method? `<div class="block"><h4>วิธี / หลักการ</h4><p>${esc(test.method)}</p></div>`:''}
      ${test.procedure? `<div class="block"><h4>ขั้นตอนปฏิบัติ</h4><ul>${test.procedure.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
      ${test.qc? `<div class="block qc-block"><h4>QC / Troubleshooting</h4><ul>${test.qc.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
      <div class="note-area">
        <h4>บันทึกส่วนตัว (เฉพาะอุปกรณ์นี้ของคุณ)</h4>
        <textarea id="note-${test.id}" placeholder="เช่น ค่าปกติเฉพาะของเครื่อง/ห้องแล็บของคุณ, ข้อควรระวังเพิ่มเติม..." onblur="handleNoteBlur('${test.id}')"></textarea>
        <div class="note-status" id="status-${test.id}"></div>
      </div>
    </div>
  </div>`;
}

function renderArtPanel(sectionId){
  const art = SECTION_ART[sectionId];
  if(!art) return '';
  return `
    <div class="art-panel">
      <h3>${esc(art.title)}</h3>
      <p class="art-desc">${esc(art.desc)}</p>
      ${art.svg}
      ${art.legend? `<div class="art-legend">${esc(art.legend)}</div>`:''}
      ${art.links? `<div class="art-links">${art.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label)}</a>`).join('')}</div>`:''}
    </div>
  `;
}

function renderSectionView(){
  const sec = SECTIONS.find(s=>s.id===state.sectionId);
  return `
    <div class="section-head">
      <h2>${esc(sec.name)}</h2>
      <p>${esc(sec.sub)}</p>
    </div>
    ${renderArtPanel(sec.id)}
    ${sec.categories.map(cat => `
      <div class="category">
        <h3>${esc(cat.name)}</h3>
        ${cat.tests.map(t=>renderTestCard(t)).join('')}
      </div>
    `).join('')}
    <div class="disclaimer">ค่าอ้างอิงในแอปนี้เป็นค่ามาตรฐานทั่วไปสำหรับผู้ใหญ่ เพื่อใช้ทบทวนความจำเท่านั้น ค่าจริงอาจแตกต่างกันตามน้ำยา เครื่องมือ และ SOP ของแต่ละห้องปฏิบัติการ — ให้ยึดค่าที่ห้องปฏิบัติการของท่านกำหนดเป็นหลักเสมอ</div>
  `;
}

function renderSearchView(){
  const q = state.query.trim().toLowerCase();
  const all = findAllTests();
  const matches = all.filter(({sec,cat,test}) => {
    const hay = [sec.name, cat.name, test.name, test.specimen, test.method, ...(test.params||[]).map(p=>p.name)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  return `
    <div class="section-head"><h2>ผลการค้นหา</h2></div>
    <div class="search-results-head">พบ ${matches.length} รายการสำหรับ "${esc(state.query)}"</div>
    ${matches.map(({sec,cat,test}) => renderTestCard(test, sec.name + ' › ' + cat.name)).join('') || '<p style="color:var(--muted)">ไม่พบรายการที่ตรงกัน ลองใช้คำค้นอื่น</p>'}
  `;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="title">MedTech Quick Reference</div>
        <div class="sub">คู่มืออ้างอิงงานเทคนิคการแพทย์ · ทุกเซคชั่นห้องปฏิบัติการ</div>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="ค้นหาการตรวจ, ค่าอ้างอิง..." value="${esc(state.query)}" oninput="handleSearch(this.value)">
      </div>
    </div>
    <div class="layout">
      ${renderNav()}
      <main>${state.query.trim() ? renderSearchView() : renderSectionView()}</main>
    </div>
  `;
  // restore focus to search input if it was focused
  // load any notes for currently open test
  if(state.openTest){
    loadNote(state.openTest).then(v=>{
      const ta = document.getElementById('note-'+state.openTest);
      if(ta) ta.value = v;
    });
  }
}

/* ===================== EVENT HANDLERS ===================== */
function selectSection(id){
  state.sectionId = id;
  state.query = '';
  state.openTest = null;
  render();
  document.querySelector('main').scrollTo(0,0);
}
function toggleTest(id){
  state.openTest = (state.openTest === id) ? null : id;
  render();
}
let searchDebounce;
function handleSearch(val){
  state.query = val;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ render(); const inp=document.getElementById('searchInput'); if(inp){inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length;} }, 180);
}
function handleNoteBlur(testId){
  const ta = document.getElementById('note-'+testId);
  const status = document.getElementById('status-'+testId);
  if(!ta) return;
  status.textContent = 'กำลังบันทึก...';
  saveNote(testId, ta.value, status);
}

render();
</script>
